name: "arxiv-paper-searcher"
description: "Searches arXiv and external bibliographic repositories for relevant academic papers and abstracts."
input_schema:
  type: object
  properties:
    query:
      type: string
      description: "Search keywords, research topic, or paper title."
    max_results:
      type: integer
      description: "Maximum number of paper entries to retrieve."
      default: 5
    fetch_full_text:
      type: boolean
      description: "Whether to download and parse the full PDF text."
      default: false
  required:
    - query
