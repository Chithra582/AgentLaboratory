name: "research-notes-ledger"
description: "Maintains an immutable structured laboratory notebook tracking hypotheses, experimental runs, and conclusions."
input_schema:
  type: object
  properties:
    action:
      type: string
      description: "Ledger operation to perform."
      enum: ["log_hypothesis", "record_run", "query_notes", "export_summary"]
    experiment_id:
      type: string
      description: "Unique identifier for the research experiment."
    entry_payload:
      type: object
      description: "Structured metadata, metrics, and observations to record."
  required:
    - action
    - experiment_id
