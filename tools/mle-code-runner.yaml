name: "mle-code-runner"
description: "Dispatches, monitors, and debugs machine learning experimental runs in isolated Python environments."
input_schema:
  type: object
  properties:
    script_path:
      type: string
      description: "File path to the Python experiment script to execute."
    timeout_seconds:
      type: integer
      description: "Maximum allowable runtime before process termination."
      default: 300
    capture_gpu_metrics:
      type: boolean
      description: "Whether to record GPU VRAM utilization and temperature during run."
      default: true
  required:
    - script_path
