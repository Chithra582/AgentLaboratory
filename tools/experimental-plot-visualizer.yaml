name: "experimental-plot-visualizer"
description: "Generates publication-quality scientific charts, ablation plots, and loss curves using Matplotlib/Seaborn."
input_schema:
  type: object
  properties:
    data_path:
      type: string
      description: "Path to the CSV or JSON file containing numerical metrics."
    plot_type:
      type: string
      description: "Style of visual plot to produce."
      enum: ["line_curve", "bar_comparison", "scatter_pareto", "heatmap"]
    output_image_path:
      type: string
      description: "Destination file path for the generated PDF or PNG figure."
    title:
      type: string
      description: "Chart title and figure caption."
  required:
    - data_path
    - plot_type
    - output_image_path
